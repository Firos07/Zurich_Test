<div class="confirm-dialog__backdrop">
  <div class="confirm-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title" class="confirm-dialog__title">{{ title() }}</h2>
    <p class="confirm-dialog__message">{{ message() }}</p>
    <div class="confirm-dialog__actions">
      <button type="button" class="btn btn--secondary" (click)="onCancel()">{{ cancelLabel() }}</button>
      <button type="button" class="btn btn--danger" (click)="onConfirm()">{{ confirmLabel() }}</button>
    </div>
  </div>
</div>
